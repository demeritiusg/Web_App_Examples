<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServiceNow Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="max-w-6xl mx-auto px-6 py-10">
      <header class="mb-8">
        <p class="text-cyan-400 uppercase tracking-[0.35em] text-sm">ServiceNow Integration</p>
        <h1 class="text-4xl font-semibold mt-2">Operational tickets at a glance</h1>
        <p class="text-slate-400 mt-3 max-w-2xl">
          Review active incidents and submit a new request without leaving your workflow.
        </p>
      </header>

      <div class="grid lg:grid-cols-[1.1fr,0.9fr] gap-6">
        <section class="bg-slate-900 rounded-2xl border border-slate-800 p-6 shadow-2xl">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-semibold">Active incidents</h2>
            <span id="countBadge" class="text-sm bg-cyan-500/10 text-cyan-300 px-3 py-1 rounded-full">Loading…</span>
          </div>
          <div id="incidentList" class="space-y-3"></div>
        </section>

        <section class="bg-slate-900 rounded-2xl border border-slate-800 p-6 shadow-2xl">
          <h2 class="text-xl font-semibold mb-4">Create a new ticket</h2>
          <form id="incidentForm" class="space-y-4">
            <div>
              <label class="block text-sm text-slate-400 mb-1">Short description</label>
              <input id="short_description" required class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2" />
            </div>
            <div>
              <label class="block text-sm text-slate-400 mb-1">Description</label>
              <textarea id="description" required rows="4" class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-sm text-slate-400 mb-1">Urgency</label>
                <select id="urgency" class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2">
                  <option value="1">1 - High</option>
                  <option value="2">2 - Medium</option>
                  <option value="3" selected>3 - Low</option>
                </select>
              </div>
              <div>
                <label class="block text-sm text-slate-400 mb-1">Impact</label>
                <select id="impact" class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2">
                  <option value="1">1 - High</option>
                  <option value="2">2 - Medium</option>
                  <option value="3" selected>3 - Low</option>
                </select>
              </div>
            </div>
            <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold py-2.5 rounded-lg transition">Submit ticket</button>
            <p id="formMessage" class="text-sm text-slate-400"></p>
          </form>
        </section>
      </div>
    </div>

    <script>
      const incidentList = document.getElementById('incidentList');
      const countBadge = document.getElementById('countBadge');
      const form = document.getElementById('incidentForm');
      const formMessage = document.getElementById('formMessage');

      async function loadIncidents() {
        const response = await fetch('/api/incidents');
        const data = await response.json();
        countBadge.textContent = `${data.length} active`;
        if (!data.length) {
          incidentList.innerHTML = '<div class="rounded-lg border border-dashed border-slate-700 p-4 text-slate-400">No incidents found.</div>';
          return;
        }
        incidentList.innerHTML = data.map((item) => `
          <article class="rounded-xl border border-slate-800 bg-slate-950/70 p-4">
            <div class="flex items-center justify-between">
              <h3 class="font-semibold">${item.number || 'Unknown'}</h3>
              <span class="text-xs text-cyan-300">State ${item.state || 'unknown'}</span>
            </div>
            <p class="text-sm text-slate-400 mt-2">${item.short_description || 'No summary available'}</p>
          </article>
        `).join('');
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        formMessage.textContent = 'Submitting…';
        const payload = {
          short_description: document.getElementById('short_description').value,
          description: document.getElementById('description').value,
          urgency: document.getElementById('urgency').value,
          impact: document.getElementById('impact').value,
        };

        const response = await fetch('/api/incidents', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const result = await response.json();
        if (response.ok) {
          formMessage.textContent = `Created ${result.number}`;
          form.reset();
          await loadIncidents();
        } else {
          formMessage.textContent = result.detail || 'Submission failed.';
        }
      });

      loadIncidents();
    </script>
  </body>
</html>
